name: Test Product CI Prod

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo
        ports:
          - 27017:27017
        options: >-
          --health-cmd "echo 'db.runCommand(\"ping\").okk' | mongosh localhost:27017/test --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Start server in background
        run: node server.js &
        env:
          PORT: 3000
          MONGO_URI: mongodb://localhost:27017/productdb

      - name: Wait for server to be ready
        run: |
          for i in {1..10}; do
            curl -sf http://localhost:3000/ && break
            echo "Waiting for server..."
            sleep 2
          done

      - name: Test - Create product (POST)
        run: |
          curl -X POST http://localhost:3000/api/products \
            -H "Content-Type: application/json" \
            -d '{"pid":"P001","pname":"Test Product","price":100000,"quantity":5}'

      - name: Test - Get all products (GET)
        run: curl -sf http://localhost:3000/api/products

      - name: Test - Get one product (GET by pid)
        run: curl -sf http://localhost:3000/api/products/P001

      - name: Test - Update product (PUT)
        run: |
          curl -X PUT http://localhost:3000/api/products/P001 \
            -H "Content-Type: application/json" \
            -d '{"price":120000}'

      - name: Test - Delete product (DELETE)
        run: curl -X DELETE http://localhost:3000/api/products/P001